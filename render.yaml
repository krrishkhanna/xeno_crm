services:
  - type: web
    name: xeno-crm-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CHANNEL_SERVICE_URL
        value: https://xeno-channel-service.onrender.com
      - key: CRM_PUBLIC_URL
        value: https://xeno-crm-backend.onrender.com
      - key: CRM_CALLBACK_URL
        value: https://xeno-crm-backend.onrender.com/api/v1/communications/callbacks/channel-service
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: MARKETING_AGENT_PROVIDER
        value: openai
      - key: MARKETING_AGENT_DEFAULT_CHANNEL
        value: sms
      - key: MARKETING_AGENT_PREVIEW_CUSTOMERS
        value: "5"
      - key: MARKETING_AGENT_ANALYTICS_TIMEOUT_SECONDS
        value: "12"
      - key: MARKETING_AGENT_ANALYTICS_POLL_INTERVAL_SECONDS
        value: "1.0"
  - type: web
    name: xeno-channel-service
    env: docker
    dockerfilePath: ./channel-service/Dockerfile
    plan: starter
    envVars:
      - key: CALLBACK_TIMEOUT_SECONDS
        value: "10"
      - key: PROVIDER_MIN_DELAY_SECONDS
        value: "1"
      - key: PROVIDER_MAX_DELAY_SECONDS
        value: "5"
      - key: CALLBACK_USER_AGENT
        value: channel-service/1.0
